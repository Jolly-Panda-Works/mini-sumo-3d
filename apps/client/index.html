<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5C8A" />
    <meta name="description" content="Mini Sumo: push your friends out of the ring. A 3D browser party game for 2 to 4 players." />
    <meta name="author" content="Usef Farahmand" />
    <link rel="author" href="https://www.useffarahmand.com" />
    <meta property="og:url" content="https://www.useffarahmand.com/en/projects/mini-sumo" />
    <title>Mini Sumo</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Mini Sumo" />
    <meta property="og:image" content="/icon-512.png" />
        <style>
      /* Boot: the Jolly Panda studio card, then the loading screen. Inline so it shows
         before the app's CSS and JavaScript arrive. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #0b1640;
        transition: opacity 0.4s ease;
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      .boot__bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }
      .boot__logo {
        display: none;
      }
      /* Landscape (desktop / web): the home background and the game logo */
      @media (orientation: landscape) {
        #boot {
          background-color: #1a2147;
          background-image: radial-gradient(ellipse at 50% 42%, rgba(120, 150, 230, 0.28), transparent 62%), url("/ui/bg-tile.webp");
          background-repeat: no-repeat, repeat;
          background-size: 100% 100%, min(70vw, 420px) auto;
        }
        .boot__bg {
          display: none;
        }
        .boot__logo {
          display: block;
          position: absolute;
          left: 50%;
          top: 44%;
          width: min(46vh, 380px);
          height: auto;
          transform: translate(-50%, -50%);
          filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.3));
        }
      }
      .boot__ui {
        position: absolute;
        left: 50%;
        bottom: calc(7vh + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        width: min(88vw, 520px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .boot__bar {
        position: relative;
        width: 100%;
        aspect-ratio: 828 / 254;
      }
      .boot__frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* The dark track inside the frame (measured from the art) */
      .boot__track {
        position: absolute;
        left: 7.97%;
        right: 7.97%;
        top: 30.3%;
        bottom: 28.7%;
      }
      .boot__fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        clip-path: inset(0 99% 0 0);
        filter: drop-shadow(0 0 6px rgba(255, 190, 40, 0.7));
      }
      .boot__runner {
        position: absolute;
        bottom: -12%;
        left: 1%;
        height: 175%;
        aspect-ratio: 142 / 180;
        transform: translateX(-62%);
        overflow: hidden;
      }
      .boot__run {
        display: block;
        height: 100%;
        width: 2200%;
        max-width: none;
        animation: boot-run 0.92s steps(22) infinite;
      }
      .boot__label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      }
      .boot__label img {
        height: clamp(22px, 4.2vw, 30px);
        width: auto;
      }
      .boot__pct {
        font-weight: 800;
        font-size: clamp(18px, 3.8vw, 24px);
        color: #ffd166;
        -webkit-text-stroke: 3px #3a1d05;
        paint-order: stroke fill;
        font-variant-numeric: tabular-nums;
      }
      @keyframes boot-run {
        to {
          transform: translateX(-100%);
        }
      }

      /* Studio card: fades in, holds, fades out (2.4 s), always on launch */
      #studio {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        background: #ffffff;
        animation: studio-out 0.5s ease 1.9s forwards;
      }
      #studio img {
        width: min(62vmin, 360px);
        height: auto;
        opacity: 0;
        animation: studio-in 0.6s ease 0.15s forwards;
      }
      @keyframes studio-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes studio-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__run {
          animation-duration: 2.2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Loading Mini Sumo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="1">
      <!-- Portrait (the Android app): the tall illustration. Landscape screens: the square one. -->
      <img class="boot__bg" src="/boot/loading-bg.webp" alt="" />
      <img class="boot__logo" src="/boot/game-logo.webp" alt="" />
      <div class="boot__ui">
        <div class="boot__bar">
          <img class="boot__frame" src="/boot/bar-frame.webp" alt="" />
          <div class="boot__track">
            <img class="boot__fill" src="/boot/bar-fill.webp" alt="" />
            <div class="boot__runner"><img class="boot__run" src="/boot/run.webp" alt="" /></div>
          </div>
        </div>
        <div class="boot__label">
          <img src="/boot/loading.webp" alt="Loading" width="319" height="57" />
          <span class="boot__pct">1%</span>
        </div>
      </div>
      <div id="studio">
        <img src="/boot/jolly-panda.webp" alt="Jolly Panda Studio" width="720" height="568" />
      </div>
    </div>
    <div id="root"></div>
    <noscript>Mini Sumo needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
