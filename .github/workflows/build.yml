# Builds Mini Sumo for web, desktop (Windows/macOS/Linux) and Android.
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   Variables
#     VITE_SERVER_URL   (required for useful builds) public Colyseus endpoint, e.g. wss://sumo-api.example.com
#     VITE_PUBLIC_URL   (optional) public web address for invite links; defaults to the GitHub Pages URL
#     DEPLOY_PAGES      (optional) "true" to publish the web build to GitHub Pages from main
#   Secrets (optional, for a signed Android release APK/AAB)
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Pushing a tag like v1.2.3 also creates a GitHub Release with all artifacts attached.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
  VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  # ------------------------------------------------------------------ checks
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - name: Build server
        run: npm run build -w @mini-sumo/server

  # ------------------------------------------------------------------ web
  web:
    name: Web
    needs: test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # GitHub Pages serves the site from /<repo>/
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Warn when no server URL is configured
        if: env.VITE_SERVER_URL == ''
        run: echo "::warning::Repository variable VITE_SERVER_URL is not set. The web build will try ws://<page-host>:2567."
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-web
          path: apps/client/dist
          if-no-files-found: error
      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ desktop
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      VITE_BASE: /
      # Unsigned builds: don't look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Warn when no server URL is configured
        if: env.VITE_SERVER_URL == ''
        shell: bash
        run: echo "::warning::VITE_SERVER_URL is not set; the desktop app will only find a server on 127.0.0.1:2567."
      - name: Install dependencies
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install desktop dependencies
        shell: bash
        run: npm install --prefix apps/desktop
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix apps/desktop
      - run: npm run build:web
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: npm run prepare:web && node scripts/package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  # ------------------------------------------------------------------ android
  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      VITE_BASE: /
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check server URL
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::warning::VITE_SERVER_URL is not set. The Android app needs a wss:// server to play."
          elif [[ "$VITE_SERVER_URL" != wss://* ]]; then
            echo "::warning::Android loads the game from https://localhost, so the server must use wss:// (got $VITE_SERVER_URL)."
          fi
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - name: Install mobile dependencies
        run: npm install --prefix apps/mobile

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#2F5C8A" --splashBackgroundColor "#2F5C8A" || echo "::warning::Icon generation failed; using default icons."
          npx cap sync android

      - name: Set version
        working-directory: apps/mobile/android
        run: |
          VERSION_NAME="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          for TYPE in APK AAB; do
            npx cap build android \
              --keystorepath "$RUNNER_TEMP/release.keystore" \
              --keystorepass "$KEYSTORE_PASSWORD" \
              --keystorealias "$KEY_ALIAS" \
              --keystorealiaspass "$KEY_PASSWORD" \
              --androidreleasetype "$TYPE"
          done

      - name: Collect outputs
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk out/MiniSumo-android-debug.apk
          find apps/mobile/android/app/build/outputs -path '*release*' \( -name '*.apk' -o -name '*.aab' \) -exec cp {} out/ \; || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-android
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip web build
        run: cd artifacts/mini-sumo-web && zip -qr ../MiniSumo-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MiniSumo-web.zip
            artifacts/mini-sumo-desktop-*/*
            artifacts/mini-sumo-android/*
