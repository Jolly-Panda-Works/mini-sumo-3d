# Builds Mini Sumo for web, desktop (Windows/macOS/Linux) and Android, and publishes a
# GitHub Release.
#
# Versions (root package.json "version" is the release line, e.g. 0.1.0):
#   tag vX.Y.Z      -> X.Y.Z, released
#   push to main    -> MAJOR.MINOR.<run number>, released (tag v<version> is created)
#   PRs / branches  -> MAJOR.MINOR.0-dev.<run number>, artifacts only
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   Variables
#     VITE_SERVER_URL   public Colyseus endpoint, e.g. wss://sumo-api.example.com
#                       (optional until the server is live; releases then show a warning)
#     VITE_PUBLIC_URL   (optional) public web address for invite links; defaults to GitHub Pages
#     DEPLOY_PAGES      (optional) "true" to publish the web build to GitHub Pages from main
#   Secrets (optional, for a signed Android release APK/AAB)
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/screenshots/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
  VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  # ------------------------------------------------------------------ version
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            VERSION="$BASE.$GITHUB_RUN_NUMBER"; RELEASE=true
          else
            VERSION="$BASE.0-dev.$GITHUB_RUN_NUMBER"; RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "### Version $VERSION (release: $RELEASE)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ checks
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - name: Build server
        run: npm run build -w @mini-sumo/server

  # ------------------------------------------------------------------ web
  web:
    name: Web
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      # GitHub Pages serves the site from /<repo>/
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Warn when no server URL is configured
        if: env.VITE_SERVER_URL == ''
        run: echo "::warning::Repository variable VITE_SERVER_URL is not set. Builds can't reach an online server."
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-web
          path: apps/client/dist
          if-no-files-found: error
      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ desktop
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      VITE_BASE: /
      # Unsigned builds: don't look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install desktop dependencies
        run: npm install --prefix apps/desktop
      - name: Set app version
        run: npm pkg set version="$VITE_APP_VERSION" --prefix apps/desktop
      - run: npm run build:web
      - name: Package
        working-directory: apps/desktop
        run: npm run prepare:web && node scripts/package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  # ------------------------------------------------------------------ android
  android:
    name: Android
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      VITE_BASE: /
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check server URL
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::warning::VITE_SERVER_URL is not set. The Android app needs a wss:// server to play."
          elif [[ "$VITE_SERVER_URL" != wss://* ]]; then
            echo "::warning::Android loads the game from https://localhost, so the server must use wss:// (got $VITE_SERVER_URL)."
          fi
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - name: Install mobile dependencies
        run: npm install --prefix apps/mobile

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#2F5C8A" --splashBackgroundColor "#2F5C8A" || echo "::warning::Icon generation failed; using default icons."
          npx cap sync android

      - name: Set version
        working-directory: apps/mobile/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          for TYPE in APK AAB; do
            npx cap build android \
              --keystorepath "$RUNNER_TEMP/release.keystore" \
              --keystorepass "$KEYSTORE_PASSWORD" \
              --keystorealias "$KEY_ALIAS" \
              --keystorealiaspass "$KEY_PASSWORD" \
              --androidreleasetype "$TYPE"
          done

      - name: Collect outputs
        run: |
          mkdir -p out
          OUTPUTS=apps/mobile/android/app/build/outputs
          cp "$OUTPUTS/apk/debug/app-debug.apk" "out/MiniSumo-$VERSION-Android.apk"
          SIGNED_APK=$(find "$OUTPUTS" -path '*release*' -name '*.apk' | head -n 1)
          SIGNED_AAB=$(find "$OUTPUTS" -path '*release*' -name '*.aab' | head -n 1)
          [ -n "$SIGNED_APK" ] && cp "$SIGNED_APK" "out/MiniSumo-$VERSION-Android-signed.apk"
          [ -n "$SIGNED_AAB" ] && cp "$SIGNED_AAB" "out/MiniSumo-$VERSION-Android-signed.aab"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-android
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  release:
    name: GitHub Release
    needs: [version, web, desktop, android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-sumo-*
      - name: Collect files and checksums
        run: |
          mkdir -p release
          (cd artifacts/mini-sumo-web && zip -qr "../../release/MiniSumo-$VERSION-Web.zip" .)
          cp artifacts/mini-sumo-desktop-*/* release/
          cp artifacts/mini-sumo-android/* release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: node tools/release-notes.mjs > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Mini Sumo v${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: release/*
