# Builds Mini Sumo for web, desktop (Windows/macOS/Linux) and Android, and publishes a
# GitHub Release.
#
# Versions: the root package.json "version" IS the release version, and GitHub tags it.
#   push to main, version not released yet -> builds X.Y.Z, creates tag vX.Y.Z + Release
#   push to main, tag vX.Y.Z already exists -> builds artifacts only (bump the version to release)
#   Actions -> Build -> Run workflow, bump = patch/minor/major
#                                           -> bumps package.json, commits it, tags and releases
#   tag vX.Y.Z pushed by hand               -> releases X.Y.Z
#   pull requests                           -> X.Y.Z-dev.<run>, artifacts only
# Android versionCode = MAJOR*1000000 + MINOR*1000 + PATCH (always grows with the version).
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   Variables
#     VITE_SERVER_URL   public Colyseus endpoint, e.g. wss://sumo-api.example.com
#                       (optional until the server is live; releases then show a warning)
#     VITE_PUBLIC_URL   (optional) public web address for invite links; defaults to GitHub Pages
#     DEPLOY_PAGES      (optional) "true" to publish the web build to GitHub Pages from main
#   Secrets (optional, for a signed Android release APK/AAB)
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/screenshots/**"
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump the version in package.json before building and releasing"
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
  VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  # ------------------------------------------------------------------ version
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      code: ${{ steps.v.outputs.code }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'none' }}
        run: |
          SHA="$GITHUB_SHA"
          # Highest released version (tags vX.Y.Z), so a bump never goes below an existing release.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          newer() { [[ -n "$2" && "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" == "$2" ]]; }
          echo "Latest released version: ${LATEST:-none}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BUMP" != "none" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then echo "::error::Run the bump from the main branch."; exit 1; fi
            CURRENT=$(node -p "require('./package.json').version")
            if newer "$CURRENT" "$LATEST"; then
              echo "::notice::package.json ($CURRENT) is behind the latest release v$LATEST; bumping from $LATEST."
              npm version "$LATEST" --no-git-tag-version --no-workspaces-update --allow-same-version > /dev/null
            fi
            npm version "$BUMP" --no-git-tag-version --no-workspaces-update > /dev/null
            NEW=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): v$NEW [skip ci]"
            git push origin HEAD:main
            SHA=$(git rev-parse HEAD)
          fi

          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
            [[ "$VERSION" != "$PKG" ]] && echo "::warning::Tag $GITHUB_REF_NAME differs from package.json version $PKG."
          elif [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            VERSION="$PKG"
            if newer "$PKG" "$LATEST"; then
              RELEASE=false
              echo "::error::package.json version $PKG is lower than the latest release v$LATEST. Set it to a higher version (or run Build with bump) to publish."
            elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
              RELEASE=false
              echo "::notice::v$VERSION is already released. Bump the version in package.json (or run Build with bump) to publish a new release."
            else
              RELEASE=true
            fi
          else
            VERSION="$PKG-dev.$GITHUB_RUN_NUMBER"; RELEASE=false
          fi

          CODE=$(node -e "const [a,b,c]='$VERSION'.split('-')[0].split('.').map(Number); console.log(a*1000000+b*1000+c)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Version $VERSION (release: $RELEASE, Android versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ checks
  test:
    name: Typecheck & test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - name: Build server
        run: npm run build -w @mini-sumo/server

  # ------------------------------------------------------------------ web
  web:
    name: Web
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      # GitHub Pages serves the site from /<repo>/
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Warn when no server URL is configured
        if: env.VITE_SERVER_URL == ''
        run: echo "::warning::Repository variable VITE_SERVER_URL is not set. Builds can't reach an online server."
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-web
          path: apps/client/dist
          if-no-files-found: error
      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ desktop
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      VITE_BASE: /
      # Unsigned builds: don't look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install desktop dependencies
        run: npm install --prefix apps/desktop
      - name: Set app version
        run: npm pkg set version="$VITE_APP_VERSION" --prefix apps/desktop
      - run: npm run build:web
      - name: Package
        working-directory: apps/desktop
        run: npm run prepare:web && node scripts/package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  # ------------------------------------------------------------------ android
  android:
    name: Android
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      VITE_BASE: /
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check server URL
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::warning::VITE_SERVER_URL is not set. The Android app needs a wss:// server to play."
          elif [[ "$VITE_SERVER_URL" != wss://* ]]; then
            echo "::warning::Android loads the game from https://localhost, so the server must use wss:// (got $VITE_SERVER_URL)."
          fi
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - name: Install mobile dependencies
        run: npm install --prefix apps/mobile

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#11276F" --splashBackgroundColor "#2F5C8A" || echo "::warning::Icon generation failed; using default icons."
          npx cap sync android
          # Portrait only.
          node scripts/orientation.mjs
          # Google Play Games sign-in + cloud save (repository variable PLAY_GAMES_APP_ID).
          PLAY_GAMES_APP_ID="${{ vars.PLAY_GAMES_APP_ID }}" node scripts/play-games.mjs

      - name: Target SDK (optional, repository variable ANDROID_TARGET_SDK)
        if: vars.ANDROID_TARGET_SDK != ''
        working-directory: apps/mobile/android
        run: |
          sed -i -E "s/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = ${{ vars.ANDROID_TARGET_SDK }}/" variables.gradle
          grep -E "SdkVersion" variables.gradle

      - name: Set version
        working-directory: apps/mobile/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ needs.version.outputs.code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # Signed with Gradle's injected signing config (the same mechanism Android Studio uses),
      # so the outputs are app-release.apk / app-release.aab, signed. Unsigned files are never shipped.
      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore, its password or the key alias in the repository secrets is wrong."; exit 1; }
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify signatures
        if: env.HAS_KEYSTORE == 'true'
        run: |
          OUTPUTS=apps/mobile/android/app/build/outputs
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUTS/apk/release/app-release.apk"
          jarsigner -verify "$OUTPUTS/bundle/release/app-release.aab" | tail -n 1

      - name: Collect outputs
        run: |
          mkdir -p out
          OUTPUTS=apps/mobile/android/app/build/outputs
          cp "$OUTPUTS/apk/debug/app-debug.apk" "out/MiniSumo-$VERSION-Android-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "$OUTPUTS/apk/release/app-release.apk" "out/MiniSumo-$VERSION-Android.apk"
            cp "$OUTPUTS/bundle/release/app-release.aab" "out/MiniSumo-$VERSION-Android.aab"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-android
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  release:
    name: GitHub Release
    needs: [version, web, desktop, android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-sumo-*
      - name: Collect files and checksums
        run: |
          mkdir -p release
          (cd artifacts/mini-sumo-web && zip -qr "../../release/MiniSumo-$VERSION-Web.zip" .)
          cp artifacts/mini-sumo-desktop-*/* release/
          cp artifacts/mini-sumo-android/* release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: node tools/release-notes.mjs > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Mini Sumo v${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: release/*
